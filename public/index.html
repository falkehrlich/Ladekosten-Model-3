<style>
:root{
  --bg:#e7e9eb; --surface:#f6f7f8; --ink:#242a30; --muted:#59626b; --line:#c5cad0;
  --sign:#0b4f8a; --yellow:#f2b300; --yellow-ink:#1b1b1b; --plate:#ffffff; --plate-ink:#1b1b1b;
  --accent:#0b4f8a; --accent-ink:#ffffff;
  --ok:#1f7444; --ok-soft:#d8eee0; --bad:#b3261e; --bad-soft:#f6dcda;
  --v0:#0b4f8a; --v1:#2a7f4f; --v2:#b85a14; --v3:#7a4fb0; --v4:#16808a; --v5:#9c3a63;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171b1f; --surface:#1f252a; --ink:#e8ebee; --muted:#9ba5af; --line:#333b43;
    --sign:#0d5aa0; --accent:#6db0f2; --accent-ink:#0b1218;
    --ok:#5cc08a; --ok-soft:#1c3a2b; --bad:#f08a80; --bad-soft:#452420;
    --v0:#5aa5f0; --v1:#4fb27d; --v2:#e0883f; --v3:#a884d8; --v4:#3fb3c0; --v5:#d16b98;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171b1f; --surface:#1f252a; --ink:#e8ebee; --muted:#9ba5af; --line:#333b43;
  --sign:#0d5aa0; --accent:#6db0f2; --accent-ink:#0b1218;
  --ok:#5cc08a; --ok-soft:#1c3a2b; --bad:#f08a80; --bad-soft:#452420;
  --v0:#5aa5f0; --v1:#4fb27d; --v2:#e0883f; --v3:#a884d8; --v4:#3fb3c0; --v5:#d16b98;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:600;margin:0;line-height:1.1}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 72px}

/* Kopf */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 0 14px}
.head h1{font-size:40px}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
.plate{display:inline-block;background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:4px;padding:2px 9px;font-weight:600;font-size:14.5px;line-height:1.35}

/* Reiter */
.tabs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line);margin:0 -16px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:5px solid transparent;margin-bottom:-2px;padding:13px 14px 9px;font:600 19px 'Barlow Condensed','Arial Narrow',sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow)}

/* Formularfelder */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.filters .span{grid-column:1/-1}
.filters.four{grid-template-columns:1fr 1fr}
@media(min-width:560px){.filters{grid-template-columns:1fr 1fr 1fr}.filters .span{grid-column:auto}.filters.four{grid-template-columns:repeat(4,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:var(--muted);font-weight:500}
select,input[type=text],input[type=date],input[type=datetime-local],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;min-height:44px;width:100%}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%23808a94' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:12px}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:130px;resize:vertical}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;font:600 16px 'Barlow',system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.dark{background:var(--yellow-ink);border-color:var(--yellow-ink);color:var(--yellow)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:36px;padding:5px 14px;font-size:14.5px}
.btn.xs{min-height:26px;padding:2px 9px;font-size:12.5px;border-width:1.5px}
.rowact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip.man{border-color:var(--accent);color:var(--accent)}
.panel.entry{margin:14px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.icon{flex:0 0 44px;width:44px;height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;font-size:24px;line-height:1;color:var(--muted);cursor:pointer}

/* Hinweisschild (gelb, wie Baustellenbeschilderung) */
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--yellow);color:var(--yellow-ink);border:3px solid var(--yellow-ink);border-radius:6px;padding:12px 14px;margin:14px 0}
.notice svg{flex:0 0 28px;margin-top:2px}
.notice p{margin:0;font-weight:500}
.notice .btn{margin-top:10px;min-height:40px}

/* Wegweiser mit Kennzahlen */
.sign{background:var(--sign);color:#fff;border-radius:12px;padding:7px;margin:16px 0 10px}
.sign-in{border:2.5px solid #fff;border-radius:7px;padding:12px 16px 4px}
.sign-head{font:600 22px/1.1 'Barlow Condensed','Arial Narrow',sans-serif}
.sign-sub{font-size:15px;opacity:.85;margin:2px 0 10px}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1.5px solid rgba(255,255,255,.38);padding:9px 0}
.srow .n{font-size:17px;font-weight:500}
.srow .v{font:600 30px/1 'Barlow Condensed','Arial Narrow',sans-serif;white-space:nowrap}
.srow .v small{font-size:19px;font-weight:500;margin-left:3px}
.srow.big .n{font-size:21px;font-weight:600}
.srow.big .v{font-size:54px}
.plates{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px 14px}

/* Abschnitte */
.sec{border-top:2px solid var(--line);margin-top:26px;padding-top:16px}
.sec h2{font-size:27px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.ctl{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.ctl button{background:none;border:0;padding:7px 14px;min-height:38px;font:600 15px 'Barlow',system-ui,sans-serif;color:var(--ink);cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.empty{padding:20px 0;color:var(--muted);margin:0}

/* Diagramm */
.chart{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.col{flex:1 0 76px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:center}
.stack{height:176px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:4px solid var(--ink);padding:0 10px}
.val{font:600 18px/1 'Barlow Condensed','Arial Narrow',sans-serif;margin-bottom:5px;white-space:nowrap}
.seg{display:block;width:100%}
.seg.top{border-radius:3px 3px 0 0}
.seg.none,.sw.none{background:repeating-linear-gradient(135deg,var(--yellow) 0 5px,#1b1b1b 5px 10px)}
.ml{font-weight:500;font-size:15px;color:var(--muted);padding-bottom:4px}
.col.dim .stack{opacity:.38}

function dur(ms){

function monthKeys(list){

  while(y<y2||(y===y2&&m<=m2)){out.push(y+'-'+pad(m));m++;if(m>12){m=1;y++;}}

function normState(o){
  if(!(o&&Array.isArray(o.sessions)&&Array.isArray(o.vehicles)&&Array.isArray(o.cards)))return null;
  o.wallboxes=Array.isArray(o.wallboxes)?o.wallboxes:[];
  o.tariff=o.tariff&&Array.isArray(o.tariff.rules)?o.tariff:{rules:[]};
  o.report=Object.assign(defaultReport(),o.report||{});

  o.sessions.forEach(s=>{if(s.fileCost==null){s.fileCost=s.cost;s.filePrice=s.price;}});
  mergeRAW(o);
  mergeSC(o);
  return o;
}

/* ---------- Abgleich mit der Datenbank (Netlify Function /api/state) ----------
   Lesen ist offen, Schreiben braucht die PIN (einmal pro Gerät). Der Browser-Speicher bleibt als Kopie erhalten. */
const API='/api/state',META='ladekosten-sync-v1',PINKEY='ladekosten-pin-v1';
const SY={version:0,dirty:false,status:'start',busy:false,rev:0,timer:null,srv:null,extra:0,msg:''};
function syMeta(){try{const m=JSON.parse(localStorage.getItem(META)||'null');if(m){SY.version=+m.version||0;SY.dirty=!!m.dirty;}}catch(e){}}
function syStore(){try{localStorage.setItem(META,JSON.stringify({version:SY.version,dirty:SY.dirty}));}catch(e){}}
function syPin(){try{return localStorage.getItem(PINKEY)||'';}catch(e){return '';}}
const sKey=s=>s.wbId+'|'+s.start;
/* Eingebaute Vorgänge (RAW, RAW_SC) kennt jedes Gerät selbst; sie zählen nicht als „nur lokal“. */
const isBaked=s=>(s.wbId===WB_ID&&RAW.some(r=>r[0]===s.start))||(s.wbId===SC_WB_ID&&RAW_SC.some(r=>r[0]===s.start));
function onlyLocal(d,skipBaked){const have=new Set((d.sessions||[]).map(sKey));return S.sessions.filter(s=>!have.has(sKey(s))&&!(skipBaked&&isBaked(s)));}
function syChanged(){
  SY.rev++;SY.dirty=true;syStore();
  clearTimeout(SY.timer);SY.timer=setTimeout(syPush,500);
  if(SY.status==='ok')syBar();
}
function syBar(){
  const el=$('#sync');if(!el)return;
  const st=SY.status;
  const b=(a,t,c)=>'<button class="btn sm '+(c||'')+'" data-act="'+a+'">'+t+'</button>';
  const n=S.sessions.length;
  let h='',cls='sync';
  if(st==='ok'){cls+=' quiet';h=SY.dirty?'Speichert …':'Gespeichert in der Datenbank · Stand '+SY.version;}
  else if(st==='lade'||st==='speichert'||st==='start'){cls+=' quiet';h=st==='lade'?'Lade aus der Datenbank …':'Speichert …';}
  else if(st==='pin'){
    h='<span class="msg"><b>'+(SY.msg?esc(SY.msg)+' ':'')+'PIN eingeben</b>, damit Änderungen in der Datenbank gespeichert werden. Bis dahin liegen sie nur auf diesem Gerät.</span>'
      +'<input type="password" id="syPin" autocomplete="current-password" placeholder="PIN" aria-label="PIN">'+b('sy-pin','Freischalten');
  }
  else if(st==='leer'){h='<span class="msg">Die Datenbank ist noch leer. Stand dieses Geräts ('+n+' '+(n===1?'Vorgang':'Vorgänge')+') dorthin übernehmen?</span>'+b('sy-init','Übernehmen');}
  else if(st==='conflict'){
    cls+=' warn';
    h='<span class="msg"><b>Anderer Stand in der Datenbank</b> (Version '+(SY.srv?SY.srv.version:'?')+'). '
      +(SY.extra?'Dieses Gerät hat '+SY.extra+' '+(SY.extra===1?'Vorgang':'Vorgänge')+', die dort fehlen. ':'')+'Was soll gelten?</span>'
      +'<div class="btnrow">'+b('sy-load','Datenbank-Stand laden','ghost')+(SY.extra?b('sy-merge','Fehlende Vorgänge ergänzen'):'')+b('sy-keep','Meinen Stand behalten','danger')+'</div>';
  }
  else if(st==='fehler'){cls+=' warn';h='<span class="msg">'+esc(SY.msg||'Fehler beim Speichern.')+'</span>'+b('sy-retry','Erneut versuchen');}
  else{ // offline
    if(SY.dirty){cls+=' warn';h='<span class="msg">Datenbank nicht erreichbar. Änderungen bleiben auf diesem Gerät und werden gesendet, sobald es wieder klappt.</span>'+b('sy-retry','Erneut versuchen');}
    else{cls+=' quiet';h='Nur lokal: Datenbank nicht erreichbar.';}
  }
  el.className=cls;el.innerHTML=h;
}
async function syGet(){
  const r=await fetch(API,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function syAdopt(doc){
  const n0=doc.data.sessions.length;
  const o=normState(doc.data);
  if(!o){SY.status='fehler';SY.msg='Die Daten in der Datenbank sind nicht lesbar.';syBar();return;}
  S=o;SY.version=doc.version;SY.srv=null;SY.extra=0;SY.msg='';
  SY.dirty=o.sessions.length>n0; // neu eingebaute Daten müssen noch in die Datenbank
  applyTariff();cacheLocal();syStore();
  SY.status='ok';render();syBar();
  if(SY.dirty)syPush();
}
function syDecide(doc){
  if(!doc||doc.version===0||!doc.data){SY.status='leer';SY.srv=null;syBar();return;}
  SY.srv=doc;SY.extra=onlyLocal(doc.data,true).length;const extraAll=onlyLocal(doc.data,false).length;
  if(SY.dirty){
    if(SY.version===doc.version){SY.status='ok';syBar();syPush();return;}
    SY.status='conflict';syBar();return;
  }
  if(SY.version===doc.version){
    if(extraAll>0){SY.dirty=true;syStore();SY.status='ok';syBar();syPush();}
    else{SY.status='ok';syBar();}
    return;
  }
  if(SY.version>0||SY.extra===0){syAdopt(doc);return;}
  SY.status='conflict';syBar();
}
async function syInit(){
  syMeta();
  if(typeof fetch!=='function'){SY.status='offline';syBar();return;}
  SY.status='lade';syBar();
  try{syDecide(await syGet());}catch(e){SY.status='offline';syBar();}
}
async function syRefresh(){
  if(typeof fetch!=='function'||SY.busy||SY.dirty||SY.status!=='ok'||U.entry||U.restorePending)return;
  try{const doc=await syGet();if(doc&&doc.version>SY.version&&doc.data&&!SY.dirty&&!SY.busy&&!U.entry)syAdopt(doc);}catch(e){}
}
async function syPush(){
  clearTimeout(SY.timer);
  if(typeof fetch!=='function')return;
  if(SY.status==='start'||SY.status==='lade'||SY.status==='conflict'||SY.status==='leer')return;
  if(SY.busy){return;}
  const pin=syPin();
  if(!pin){SY.status='pin';syBar();return;}
  SY.busy=true;const rev=SY.rev;SY.status='speichert';syBar();
  let again=false;
  try{
    const r=await fetch(API,{method:'PUT',headers:{'content-type':'application/json','x-write-pin':pin},body:JSON.stringify({baseVersion:SY.version,data:S})});
    if(r.status===401){try{localStorage.removeItem(PINKEY);}catch(e){}SY.status='pin';SY.msg='PIN falsch.';}
    else if(r.status===409){const doc=await r.json();SY.busy=false;SY.status='ok';SY.dirty=true;syDecide(doc);return;}
    else if(!r.ok){let m='';try{m=(await r.json()).error||'';}catch(e){}SY.status='fehler';SY.msg='Speichern fehlgeschlagen'+(m?': '+m.replace(/\.$/,''):' (Fehler '+r.status+')')+'.';}
    else{
      const j=await r.json();SY.version=j.version;SY.msg='';SY.status='ok';
      if(SY.rev===rev)SY.dirty=false;else again=true;
      syStore();
    }
  }catch(e){SY.status='offline';}
  SY.busy=false;syBar();
  if(again)syPush();
}
function syMerge(){
  const d=SY.srv.data,extra=onlyLocal(d,true),ids=new Set(d.sessions.map(x=>x.id));
  d.seq=d.seq||0;
  extra.forEach(x=>{let id;do{id='s'+(++d.seq);}while(ids.has(id));ids.add(id);d.sessions.push(Object.assign({},x,{id:id}));});
  const o=normState(d);if(!o)return;
  S=o;SY.version=SY.srv.version;SY.dirty=true;SY.srv=null;SY.extra=0;SY.status='ok';
  applyTariff();cacheLocal();syStore();render();syBar();syPush();
}

/* Preisregeln: die jüngste Regel vor dem Vorgang gilt, bei gleichem Datum schlägt eine Wallbox-Regel die Regel für alle */
function priceFor(s){
  if(s.manual||s.wbId===SC_WB_ID)return null;
  const d=s.start.slice(0,10);let best=null;
  S.tariff.rules.forEach(r=>{
    if(!r.from||r.from>d||!(r.price>0))return;
    if(r.wbId!=='all'&&r.wbId!==s.wbId)return;
    if(!best||r.from>best.from||(r.from===best.from&&r.wbId!=='all'&&best.wbId==='all'))best=r;
  });
  return best;
}
function applyTariff(){
  S.sessions.forEach(s=>{
    if(s.fileCost==null){s.fileCost=s.cost;s.filePrice=s.price;}
    if(s.manual)return;
    const r=priceFor(s);
    if(r){s.price=r.price;s.cost=Math.round(s.kwh*r.price*100)/100;}
    else{s.price=s.filePrice;s.cost=s.fileCost;}
  });
}

    place:x.wbId,newPlace:'',veh:x.vehicleId||'',note:x.note||''};

function entryCalc(E){
  const kwh=parseNum(E.kwh);
  const hp=String(E.price).trim()!=='',hc=String(E.cost).trim()!=='';
  const p=hp?parseNum(E.price):null,c=hc?parseNum(E.cost):null;
  if(!(kwh>0))return {err:'Gib die Energie in kWh ein, größer als 0.'};
  if(!hp&&!hc)return {err:'Gib den Preis je kWh oder die Gesamtkosten ein.'};
  if((hp&&(p==null||p<0))||(hc&&(c==null||c<0)))return {err:'Preis und Kosten müssen Zahlen ab 0 sein.'};
  let cost,price;
  if(hc){cost=Math.round(c*100)/100;price=hp?p:cost/kwh;}
  else{price=p;cost=Math.round(kwh*price*100)/100;}
  return {kwh:kwh,price:price,cost:cost};
}

/* ---------- CSV-Import ---------- */
function parseCSV(text,d){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r')cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function parseNum(s){
  if(s==null)return null;
  s=String(s).replace(/kWh|[€\s]/gi,'');
  if(!s)return null;
  if(s.indexOf(',')>=0&&s.indexOf('.')>=0){
    s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  }else if(s.indexOf(',')>=0)s=s.replace(',','.');
  const n=parseFloat(s);
  return isFinite(n)?n:null;
}
function parseDT(s){
  s=(s||'').trim();
  let m=s.match(/(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3]+'T'+pad(m[4])+':'+m[5]+':'+(m[6]||'00');
  m=s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1])+'T'+pad(m[4])+':'+m[5]+':'+(m[6]||'00');
  return null;
}
function parseWb(s){
  s=(s||'').trim();
  if(!s)return {id:'wallbox-1',name:'Wallbox'};
  const m=s.match(/^(.*?)\s*\(\s*ID:\s*([^)]+?)\s*\)/i);
  if(m)return {id:m[2],name:m[1]||m[2]};
  return {id:s,name:s};
}
const FIELDS=[['start','Zeitraum'],['wallbox','Wallbox (optional)'],['rfid','Authentifizierung (optional)'],['kwh','Geladen - kWh']];
const RX={kosten:/kosten|betrag|cost/i,preis:/preis|price|tarif/i,kwh:/kwh|energie|menge/i,rfid:/rfid|karte|auth|token/i,wallbox:/wallbox|station|ladepunkt|charger/i,start:/zeitraum|start|beginn|\bvon\b|datum/i,ende:/ende|\bend\b|\bbis\b/i};
function isTeslaExport(h){
  const low=h.map(x=>String(x||'').toLowerCase().trim());
  return low.indexOf('chargestartdatetime')>=0&&low.indexOf('sitelocationname')>=0&&low.indexOf('quantitybase')>=0;
}
function teslaColIdx(h){
  const low=h.map(x=>String(x||'').toLowerCase().trim());
  return {start:low.indexOf('chargestartdatetime'),loc:low.indexOf('sitelocationname'),kwh:low.indexOf('quantitybase'),price:low.indexOf('unitcostbase'),total:low.indexOf('total inc. vat')};
}
function teslaLocClean(s){return String(s||'').replace(/,\s*Germany\b/i,'').trim();}
function parseTeslaPrice(s){return parseNum(String(s||'').split('/')[0]);}
const sigOf=h=>h.map(x=>x.toLowerCase().replace(/\d+/g,'').replace(new RegExp(MON.join('|'),'gi'),'').replace(/\s+/g,' ').trim()).join('|');
function guessMap(h){
  try{const j=JSON.parse(localStorage.getItem(MAPSTORE)||'null');if(j&&j.sig===sigOf(h))return j.map;}catch(e){}
  const map={},used=new Set();
  ['kwh','rfid','wallbox','start'].forEach(f=>{
    const test=f==='kwh'?(x=>RX.kwh.test(x)&&!/preis/i.test(x)):(x=>RX[f].test(x));
    const i=h.findIndex((x,k)=>!used.has(k)&&test(x));
    map[f]=i;if(i>=0)used.add(i);
  });
  return map;
}
function saveMap(){try{localStorage.setItem(MAPSTORE,JSON.stringify({sig:sigOf(imp.headers),map:imp.map}));}catch(e){}}
function parseImport(){
  imp.done=null;imp.err='';
  const text=imp.text.replace(/^\uFEFF/,'');
  if(!text.trim()){imp.err='Keine Daten gefunden. Wähle eine CSV-Datei oder füge den Inhalt ein.';imp.rows=null;renderImpResult();return;}
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const cnt=d=>first.split(d).length-1;
  const delim=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const all=parseCSV(text,delim);
  if(all.length<2){imp.err='Die Datei braucht eine Kopfzeile und mindestens eine Datenzeile.';imp.rows=null;renderImpResult();return;}
  let hi=all.findIndex(r=>(r.some(c=>/kwh/i.test(c))&&r.some(c=>/zeitraum|start|beginn|datum|\bvon\b/i.test(c)))||isTeslaExport(r));
  if(hi<0)hi=0;
  const head=all[hi].map(h=>h.trim());
  const isHead=r=>head.reduce((n,h,i)=>n+(i>0&&h&&String(r[i]==null?'':r[i]).trim()===h?1:0),0)>=2;
  const isTitle=r=>r.slice(1).every(c=>String(c).trim()==='')&&!/^(gesamt|summe|total)\b/i.test(String(r[0]).trim())&&!parseDT(r[0]);
  const body=all.slice(hi+1);
  imp.headers=head;
  imp.format=isTeslaExport(head)?'tesla':'wallbox';
  imp.rows=body.filter(r=>!isHead(r)&&!isTitle(r));
  imp.skipped=hi+(body.length-imp.rows.length);
  if(!imp.rows.length){imp.err='Unter der Kopfzeile stehen keine Datenzeilen.';imp.rows=null;renderImpResult();return;}
  if(imp.format==='tesla'){
    const ti=teslaColIdx(imp.headers);
    imp.map={start:ti.start,wallbox:-1,rfid:-1,kwh:ti.kwh};
    imp.teslaLocIdx=ti.loc;imp.teslaPriceIdx=ti.price;imp.teslaTotalIdx=ti.total;
  }else{
    imp.map=guessMap(imp.headers);
  }
  renderImpResult();
}
function resolveWb(p){
  const w=S.wallboxes.find(x=>x.id===p.id)||S.wallboxes.find(x=>x.name.toLowerCase()===p.name.toLowerCase());
  return w?{id:w.id,name:w.name}:p;
}
function evalImport(){
  const map=imp.map;
  const has=f=>map[f]>=0;
  const get=(r,f)=>has(f)?String(r[map[f]]==null?'':r[map[f]]).trim():'';
  const seen=new Set(S.sessions.map(s=>s.wbId+'|'+s.start));
  const existing=new Map(S.sessions.map(s=>[s.wbId+'|'+s.start,s]));
  const changed=new Set();
  const list=[],checks=[];
  let bk=0,bn=0,bm=null;
  imp.rows.forEach((r,idx)=>{
    const row=idx+1;
    if(r.some(c=>/^(gesamt|summe|total)\b/i.test(String(c).trim()))){
      const fk=has('kwh')?parseNum(get(r,'kwh')):null;
      checks.push({label:bm?mLong(bm):'Block',fk:fk,ck:bk,n:bn});
      bk=0;bn=0;bm=null;
      list.push({status:'summe',row:row,msg:'Summenzeile der Datei. Das Tool rechnet selbst.'});return;
    }
    const rg=get(r,'start').split(/\s+[-\u2013]\s+/);
    const start=parseDT(rg[0]);
    let end=rg.length>1?parseDT(rg[1]):null;
    if(!start){list.push({status:'fehler',row:row,msg:'Startzeit nicht lesbar'});return;}
    const kwh=parseNum(get(r,'kwh'));
    if(kwh==null||kwh<0){list.push({status:'fehler',row:row,msg:'kWh nicht lesbar'});return;}
    if(end&&toMs(end)<toMs(start)){list.push({status:'fehler',row:row,msg:'Ende liegt vor dem Start'});return;}
    const wbRaw=get(r,'wallbox');
    const wb=resolveWb(parseWb(wbRaw));
    let rfRaw=get(r,'rfid');
    if(!rfRaw){const m0=wbRaw.match(/RFID:?\s*([0-9A-Za-z_-]+)/i);if(m0)rfRaw=m0[1];}
    const rm=rfRaw.match(/RFID:?\s*([0-9A-Za-z_-]+)/i);
    const rfid=((rm?rm[1]:rfRaw).trim().toUpperCase())||'OHNE KARTE';
    const rule=priceFor({start:start,wbId:wb.id,manual:false});
    const price=rule?rule.price:0;
    const cost=rule?Math.round(kwh*rule.price*100)/100:0;
    const s={wbId:wb.id,rfid:rfid,start:start,end:end,kwh:kwh,price:price,cost:cost};
    bk+=kwh;bn++;if(!bm)bm=start.slice(0,7);
    const key=wb.id+'|'+start;
    if(seen.has(key)){
      const ex=existing.get(key);
      if(ex&&!changed.has(key)){
        const ch=[];
        if(ex.rfid!==rfid)ch.push('Karte '+ex.rfid+' \u2192 '+rfid);
        if(Math.abs(ex.kwh-kwh)>0.004)ch.push('kWh '+n2.format(ex.kwh)+' \u2192 '+n2.format(kwh));
        if(end&&ex.end&&ex.end!==end)ch.push('Ende '+fT(ex.end)+' \u2192 '+fT(end));
        if(ch.length){changed.add(key);list.push({status:'geaendert',row:row,s:s,ex:ex,msg:'Geändert im Quellsheet: '+ch.join(', ')});return;}
      }
      list.push({status:'duplikat',row:row,s:s,msg:'Gibt es schon (gleiche Wallbox und Startzeit)'});return;
    }
    seen.add(key);
    const un=!isAssigned(rfid);
    list.push({status:'neu',row:row,s:s,wbName:wb.name,
      msg:un?'Karte '+rfid+' ohne Fahrzeug':vehName(vehOfCard(rfid))});
  });
  return {list:list,checks:checks};
}
function evalImportTesla(){
  const si=imp.map.start,ki=imp.map.kwh,locIdx=imp.teslaLocIdx,priceIdx=imp.teslaPriceIdx,totalIdx=imp.teslaTotalIdx;
  const seen=new Set(S.sessions.map(s=>s.wbId+'|'+s.start));
  const existing=new Map(S.sessions.map(s=>[s.wbId+'|'+s.start,s]));
  const changed=new Set();
  const list=[];
  const vehId=S.vehicles[0]?S.vehicles[0].id:null;
  imp.rows.forEach((r,idx)=>{
    const row=idx+1;
    const start=parseDT(String(r[si]==null?'':r[si]).trim());
    if(!start){list.push({status:'fehler',row:row,msg:'Startzeit nicht lesbar'});return;}
    const kwh=parseNum(String(r[ki]==null?'':r[ki]).trim());
    if(kwh==null||kwh<0){list.push({status:'fehler',row:row,msg:'kWh nicht lesbar'});return;}
    let price=priceIdx>=0?parseTeslaPrice(r[priceIdx]):null;
    if(price==null||price<0)price=0;
    let cost=Math.round(kwh*price*100)/100;
    /* Maßgeblich ist der Rechnungsbetrag (Total Inc. VAT): Guthaben-Ladungen stehen dort mit 0,00, obwohl ein Listenpreis je kWh dasteht */
    const tot=totalIdx>=0?parseNum(String(r[totalIdx]==null?'':r[totalIdx]).trim()):null;
    if(tot!=null&&tot>=0){cost=Math.round(tot*100)/100;if(kwh>0)price=Math.round(tot/kwh*10000)/10000;}
    const loc=locIdx>=0?teslaLocClean(r[locIdx]):'';
    const s={wbId:SC_WB_ID,rfid:'',start:start,end:null,kwh:kwh,price:price,cost:cost,loc:loc,vehicleId:vehId};
    const key=s.wbId+'|'+s.start;
    if(seen.has(key)){
      const ex=existing.get(key);
      if(ex&&!changed.has(key)){
        const ch=[];
        if(Math.abs(ex.kwh-kwh)>0.004)ch.push('kWh '+n2.format(ex.kwh)+' → '+n2.format(kwh));
        if(Math.abs((ex.price||0)-price)>0.0005)ch.push('Preis '+n4.format(ex.price||0)+' → '+n4.format(price));
        if(loc&&ex.loc!==loc)ch.push('Ort '+(ex.loc||'-')+' → '+loc);
        if(ch.length){changed.add(key);list.push({status:'geaendert',row:row,s:s,ex:ex,msg:'Geändert gegenüber vorhandenem Vorgang: '+ch.join(', ')});return;}
      }
      list.push({status:'duplikat',row:row,s:s,msg:'Gibt es schon (gleiche Startzeit am Supercharger)'});return;
    }
    seen.add(key);

      msg:(loc?loc+' · ':'')+'Supercharger'+(vehId?' · '+vehName(vehId):'')});

}

function doImport(){
  if(!imp.rows)return;
  const r=evalImportAny();
  const add=r.list.filter(x=>x.status==='neu'||x.status==='pruefen');
  const upd=r.list.filter(x=>x.status==='geaendert');
  if(!add.length&&!upd.length)return;
  const newCards=new Set();
  upd.forEach(x=>{
    const e=x.ex,n=x.s;
    e.rfid=n.rfid;e.kwh=n.kwh;e.cost=n.cost;e.price=n.price;e.fileCost=n.cost;e.filePrice=n.price;if(n.end)e.end=n.end;
    if(n.loc)e.loc=n.loc;
    if(n.rfid&&!isAssigned(n.rfid))newCards.add(n.rfid);
  });
  add.forEach(x=>{
    const s=x.s;s.id='s'+(++S.seq);s.fileCost=s.cost;s.filePrice=s.price;
    S.sessions.push(s);
    if(!S.wallboxes.some(w=>w.id===s.wbId))S.wallboxes.push({id:s.wbId,name:x.wbName});
    if(s.rfid&&!isAssigned(s.rfid))newCards.add(s.rfid);
  });
  save();
  imp=newImp();imp.done={n:add.length,u:upd.length,cards:[...newCards]};
  render();
  toast((add.length?add.length+' '+(add.length===1?'Vorgang':'Vorgänge')+' importiert':'')+(add.length&&upd.length?', ':'')+(upd.length?upd.length+' aktualisiert':''));
}

function bucketOf(s,time){
  const y=s.start.slice(0,4),m=+s.start.slice(5,7);

function periodLabel(kind,o){

function periodRange(kind,p){
  if(!p)return {from:'0000-01-01',to:'9999-12-31'};
  if(kind==='monat'){return {from:p+'-01',to:p+'-'+pad2(lastDay(+p.slice(0,4),+p.slice(5,7)))};}
  if(kind==='quartal'){const y=+p.slice(0,4),m1=(+p.slice(6,7)-1)*3+1,m3=m1+2;return {from:y+'-'+pad2(m1)+'-01',to:y+'-'+pad2(m3)+'-'+pad2(lastDay(y,m3))};}

function repData(){
  const R=U.rep,rg=repRange();
  const list=S.sessions.filter(x=>{
    const d=x.start.slice(0,10);
    if(d<rg.from||d>rg.to)return false;
    const v=vehOf(x);
    if(R.fVeh==='none'){if(v!==null)return false;}else if(R.fVeh!=='all'&&v!==R.fVeh)return false;
    if(R.fWb!=='all'&&x.wbId!==R.fWb)return false;
    if(R.fCard!=='all'&&x.rfid!==R.fCard)return false;
    return true;
  }).sort((a,b)=>a.start.localeCompare(b.start));
  const agg=l=>({n:l.length,kwh:sum(l,'kwh'),cost:sum(l,'cost')});
  const order=k=>{
    if(R.dim==='veh'){const i=S.vehicles.findIndex(v=>v.id===k);return i<0?999:i;}
    if(R.dim==='wb'){const i=S.wallboxes.findIndex(w=>w.id===k);return i<0?999:i;}
    return 0;
  };
  const keys=uniq(list.map(x=>grpKey(x,R.dim))).sort((a,b)=>order(a)-order(b)||String(a).localeCompare(String(b)));
  const groups=keys.map(k=>{
    const gl=list.filter(x=>grpKey(x,R.dim)===k);
    const bk=uniq(gl.map(x=>bucketOf(x,R.time))).sort();
    return {key:k,label:grpLabel(k,R.dim),total:agg(gl),
      rows:bk.map(b=>Object.assign({key:b,label:bucketLabel(b)},agg(gl.filter(x=>bucketOf(x,R.time)===b)))) };
  });
  return {list:list,range:rg,groups:groups,total:agg(list)};
}
function repTables(D){
  const R=U.rep,tm=R.time,dm=R.dim,out=[];
  if(!D.list.length)return out;
  const row=(label,a)=>[label,String(a.n),n2.format(a.kwh),n3.format(ppk(a)),n2.format(a.cost)+' €'];
  const H=first=>[first,'Vorgänge','kWh','Ø €/kWh','Kosten'];
  const al=['l','r','r','r','r'];
  if(dm==='none'){
    const g=D.groups[0];
    out.push({title:'',head:H('Zeitraum'),rows:g.rows.map(r=>row(r.label,r)),foot:g.rows.length>1?row('Gesamt',D.total):null,al:al});
  }else if(tm==='none'){
    out.push({title:'',head:H(dimName(dm)),rows:D.groups.map(g=>row(g.label,g.total)),foot:D.groups.length>1?row('Gesamt',D.total):null,al:al});
  }else{
    D.groups.forEach(g=>out.push({title:dimName(dm)+': '+g.label,head:H('Zeitraum'),rows:g.rows.map(r=>row(r.label,r)),foot:g.rows.length>1?row('Summe',g.total):null,al:al}));
    if(D.groups.length>1)out.push({title:'Gesamt aller Gruppen',head:H('Zeitraum'),rows:[row('Gesamter Zeitraum',D.total)],foot:null,al:al});
  }
  return out;
}
function repSessionTable(D){
  const rows=D.list.map(x=>{const v=vehOf(x);return [fDay(x.start.slice(0,10))+' '+fT(x.start),v?vehName(v):'nicht zugeordnet',x.rfid||'ohne Karte',wbName(x.wbId),n2.format(x.kwh),n3.format(x.price),n2.format(x.cost)+' €'];});
  return {title:'Einzelvorgänge',head:['Start','Fahrzeug','Karte','Wallbox','kWh','€/kWh','Kosten'],rows:rows,
    foot:['Summe','','','',n2.format(D.total.kwh),'',n2.format(D.total.cost)+' €'],al:['l','l','l','l','r','r','r']};
}
function priceNotes(D){
  const used=new Set(),lines=[];
  D.list.forEach(x=>{const r=priceFor(x);if(r)used.add(r.id);});
  S.tariff.rules.slice().sort((a,b)=>a.from.localeCompare(b.from)).forEach(r=>{
    if(used.has(r.id))lines.push('Preis je kWh '+n4.format(r.price)+' € ab '+fDay(r.from)+(r.wbId==='all'?'':' ('+wbName(r.wbId)+')'));
  });
  const fl=D.list.filter(x=>!x.manual&&!priceFor(x));
  if(fl.length){const k=sum(fl,'kwh'),c=sum(fl,'cost');lines.push('Kosten laut Ladeprotokoll'+(k>0?' (Ø '+n3.format(c/k)+' € je kWh)':''));}
  const ml=D.list.filter(x=>x.manual);
  if(ml.length){const k=sum(ml,'kwh'),c=sum(ml,'cost');lines.push('Manuell erfasst: '+ml.length+' '+(ml.length===1?'Vorgang':'Vorgänge')+' mit eigenem Preis je kWh (Ø '+n3.format(k>0?c/k:0)+' €)');}
  return lines;
}
function rpTable(t){

    +'<table class="rp-t"><thead><tr>'+t.head.map((c,i)=>cell(c,i,'th')).join('')+'</tr></thead><tbody>'
    +t.rows.map(r=>'<tr>'+r.map((c,i)=>cell(c,i,'td')).join('')+'</tr>').join('')+'</tbody>'

function fitSheet(){
  const wrap=$('.sheet-wrap'),sh=$('#sheet');
  if(!wrap||!sh)return;
  const aw=wrap.clientWidth,w=sh.offsetWidth;
  if(!(aw>0&&w>0))return;
  const sc=Math.min(1,aw/w);
  sh.style.transform='scale('+sc+')';
  wrap.style.height=Math.ceil(sh.offsetHeight*sc)+'px';
}
function refreshSheet(){const sh=$('#sheet');if(sh){sh.innerHTML=sheetInnerHTML();fitSheet();}}

function buildPDF(D){
  const T=S.report,B=T.blocks,jsPDF=window.jspdf.jsPDF;
  const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  const L=16,RX=194,W=RX-L,BOT=278;
  let y=18;
  const need=h=>{if(y+h>BOT){doc.addPage();y=18;}};
  const put=(t,x,yy,o)=>doc.text(String(t),x,yy,o);
  const atb=t=>{
    if(t.title){need(24);doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(20);put(t.title,L,y);y+=2;}
    doc.autoTable({startY:y,margin:{left:L,right:210-RX,top:18,bottom:18},head:[t.head],body:t.rows,foot:t.foot?[t.foot]:undefined,theme:'plain',showFoot:'lastPage',
      styles:{font:'helvetica',fontSize:8.6,cellPadding:{top:1.7,bottom:1.7,left:1.6,right:1.6},textColor:[25,25,25],lineWidth:0},
      headStyles:{fontStyle:'bold',textColor:[70,70,70]},
      footStyles:{fontStyle:'bold',fillColor:[243,243,243],textColor:[25,25,25]},
      didParseCell:d=>{if(t.al[d.column.index]==='r')d.cell.styles.halign='right';},
      didDrawCell:d=>{
        const c=d.cell,x2=c.x+c.width,yb=c.y+c.height;
        if(d.section==='head'){doc.setDrawColor(25);doc.setLineWidth(0.5);doc.line(c.x,yb,x2,yb);}
        else if(d.section==='foot'){doc.setDrawColor(25);doc.setLineWidth(0.4);doc.line(c.x,c.y,x2,c.y);}
        else{doc.setDrawColor(205);doc.setLineWidth(0.2);doc.line(c.x,yb,x2,yb);}
      }});
    y=doc.lastAutoTable.finalY+7;
  };
  doc.setFont('helvetica','bold');doc.setFontSize(19);doc.setTextColor(20);
  put(T.title||'Ladekostenabrechnung',L,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(110);
  put('Erstellt am '+fDay(isoDate(new Date())),RX,y,{align:'right'});
  y+=7;
  doc.setFontSize(10.5);doc.setTextColor(60);
  put('Zeitraum: '+rangeText(D.range),L,y);
  y+=3.5;
  doc.setDrawColor(11,79,138);doc.setLineWidth(0.9);doc.line(L,y,RX,y);
  y+=8;
  if((T.sender||'').trim()||(T.recipient||'').trim()){
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(30);
    const a=doc.splitTextToSize(T.sender||' ',80),b=doc.splitTextToSize(T.recipient||' ',80);
    a.forEach((l,i)=>put(l,L,y+i*4.4));
    b.forEach((l,i)=>put(l,L+98,y+i*4.4));
    y+=Math.max(a.length,b.length)*4.4+5;
  }
  if((T.intro||'').trim()){
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(30);
    doc.splitTextToSize(T.intro,W).forEach(l=>{need(5);put(l,L,y);y+=4.6;});
    y+=3;
  }
  if(B.kpi){
    const t=D.total,kp=[['Kosten',n2.format(t.cost)+' €'],['Energie',n2.format(t.kwh)+' kWh'],['Ø Preis',n3.format(ppk(t))+' €/kWh'],['Ladevorgänge',String(t.n)]];
    need(24);
    const bw=(W-9)/4;
    kp.forEach((k,i)=>{
      const x=L+i*(bw+3);
      doc.setDrawColor(200);doc.setLineWidth(0.25);doc.rect(x,y,bw,16);
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(100);put(k[0],x+3,y+5.2);
      doc.setFont('helvetica','bold');doc.setFontSize(12.5);doc.setTextColor(20);put(k[1],x+3,y+12.2);
    });
    y+=23;
  }
  if(B.breakdown)repTables(D).forEach(atb);
  if(B.price){
    const nt=priceNotes(D);
    if(nt.length){
      need(12+nt.length*4.5);
      doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(20);put('Preis je kWh',L,y);y+=5.2;
      doc.setFont('helvetica','normal');doc.setFontSize(9.2);doc.setTextColor(40);
      nt.forEach(l=>{put(l,L,y);y+=4.5;});
      y+=5;
    }
  }
  if(B.sessions)atb(repSessionTable(D));
  if(B.sign){
    need(32);y+=14;
    doc.setDrawColor(20);doc.setLineWidth(0.25);doc.line(L,y,L+72,y);doc.line(L+98,y,RX,y);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(90);
    put('Ort, Datum',L,y+4);put('Unterschrift',L+98,y+4);
    y+=12;
  }
  if((T.footer||'').trim()){
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(50);y+=3;
    doc.splitTextToSize(T.footer,W).forEach(l=>{need(5);put(l,L,y);y+=4.4;});
  }
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120);
    put((T.title||'')+', '+rangeText(D.range),L,289);
    put('Seite '+i+' von '+n,RX,289,{align:'right'});
  }
  return doc;
}
function pdfName(D){
  const R=U.rep,base=R.kind==='frei'?fDay(D.range.from).replace(/\./g,'-')+'_bis_'+fDay(D.range.to).replace(/\./g,'-'):R.period;
  return 'Ladekosten_'+String(base).replace(/[^0-9A-Za-z_-]+/g,'-')+'.pdf';
}
async function savePDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('Die PDF-Erzeugung ist nicht geladen. Nutze Drucken.');return;}
  const D=repData();
  if(!D.list.length){toast('Keine Vorgänge im gewählten Zeitraum');return;}
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){dl=null;}
  try{
    const doc=buildPDF(D);
    if(dl)await dl.save({filename:pdfName(D),data:doc.output('arraybuffer')});
    else doc.save(pdfName(D));
    toast('PDF gespeichert');
  }catch(e){
    toast(e&&e.code==='declined'?'Speichern abgebrochen':'Das PDF ließ sich nicht speichern');
  }
}
function exportName(){return 'Ladekosten-Daten_'+isoDate(new Date())+'.json';}
function exportPayload(){
  return JSON.stringify({exportedAt:new Date().toISOString(),app:'Ladekosten-Dashboard',version:1,
    vehicles:S.vehicles,cards:S.cards,wallboxes:S.wallboxes,tariff:S.tariff,report:S.report,sessions:S.sessions},null,2);
}
function restoreConfirmHTML(d){
  const n=Array.isArray(d.sessions)?d.sessions.length:0;

  return '<div class="confirm"><p><b>Sicherung wiederherstellen?</b> Enthält '+n+' '+(n===1?'Vorgang':'Vorgänge')+', erstellt am '+esc(when)+'. Ersetzt alle aktuellen Daten auf allen Geräten, das lässt sich nicht rückgängig machen.</p>'

function applyRestore(data){
  S={seq:0,
    vehicles:Array.isArray(data.vehicles)?data.vehicles:[],
    cards:Array.isArray(data.cards)?data.cards:[],
    wallboxes:Array.isArray(data.wallboxes)?data.wallboxes:[],
    tariff:(data.tariff&&Array.isArray(data.tariff.rules))?data.tariff:{rules:[]},
    report:Object.assign(defaultReport(),data.report||{}),
    sessions:Array.isArray(data.sessions)?data.sessions:[]};
  S.report.blocks=Object.assign(defaultReport().blocks,S.report.blocks||{});
  S.sessions.forEach(s=>{if(s.fileCost==null){s.fileCost=s.cost;s.filePrice=s.price;}});
  let maxSeq=0;
  [].concat(S.vehicles.map(v=>v.id),S.wallboxes.map(w=>w.id),S.sessions.map(s=>s.id),S.tariff.rules.map(r=>r.id)).forEach(id=>{
    const m=String(id==null?'':id).match(/(\d+)$/);if(m)maxSeq=Math.max(maxSeq,+m[1]);
  });
  S.seq=maxSeq;
  U.restorePending=null;U.veh='all';U.card='all';U.wb='all';U.month='all';U.delCard=null;U.delWb=null;U.rep=null;U.entry=null;U.delSess=null;imp=newImp();
  save();render();toast('Sicherung wiederhergestellt: '+S.sessions.length+' '+(S.sessions.length===1?'Vorgang':'Vorgänge'));
}
async function exportData(){
  const json=exportPayload();
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){dl=null;}
  try{
    if(dl){
      await dl.save({filename:exportName(),data:new TextEncoder().encode(json).buffer});
    }else{
      let href,revoke=null;
      try{const blob=new Blob([json],{type:'application/json'});href=URL.createObjectURL(blob);revoke=href;}
      catch(e){href='data:application/json;charset=utf-8,'+encodeURIComponent(json);}
      const a=document.createElement('a');
      a.href=href;a.download=exportName();document.body.appendChild(a);a.click();a.remove();
      if(revoke)setTimeout(()=>URL.revokeObjectURL(revoke),1000);
    }
    toast('Alle Daten exportiert');
  }catch(e){
    toast(e&&e.code==='declined'?'Export abgebrochen':'Die Daten ließen sich nicht exportieren');
  }
}

  const t=e.target.closest('[data-act]');if(!t)return;
  switch(t.dataset.act){
    case 'sy-pin':{const v=(($('#syPin')||{}).value||'').trim();if(!v)break;try{localStorage.setItem(PINKEY,v);}catch(x){}SY.msg='';SY.status='ok';SY.dirty=true;syStore();syPush();break;}
    case 'sy-init':SY.version=0;SY.dirty=true;SY.status='ok';syStore();syPush();break;
    case 'sy-retry':if(SY.dirty){SY.status='ok';syPush();}else syInit();break;
    case 'sy-load':if(SY.srv)syAdopt(SY.srv);break;
    case 'sy-merge':if(SY.srv)syMerge();break;
    case 'sy-keep':if(SY.srv){SY.version=SY.srv.version;SY.dirty=true;SY.srv=null;SY.extra=0;SY.status='ok';syStore();syPush();}break;
    case 'month':U.month=U.month===t.dataset.m?'all':t.dataset.m;render();break;
    case 'metric':U.metric=t.dataset.v;render();break;
    case 'goto-admin':U.tab='admin';render();window.scrollTo(0,0);break;
    case 'goto-overview':U.tab='overview';render();window.scrollTo(0,0);break;
    case 'sample':imp.text=SAMPLE;{const ta=$('#impText');if(ta)ta.value=SAMPLE;}parseImport();break;
    case 'parse':{const ta=$('#impText');if(ta)imp.text=ta.value;parseImport();break;}
    case 'do-import':doImport();break;
    case 'add-veh':{
      const i=$('#newVeh'),n=i?i.value.trim():'';
      if(!n){toast('Gib dem Fahrzeug einen Namen');return;}
      S.vehicles.push({id:'v'+(++S.seq),name:n});save();render();toast('Fahrzeug angelegt');break;}
    case 'del-veh':{
      const id=t.dataset.id;
      S.vehicles=S.vehicles.filter(v=>v.id!==id);
      S.cards.forEach(c=>{if(c.vehicleId===id)c.vehicleId=null;});
      S.sessions.forEach(x=>{if(x.vehicleId===id)x.vehicleId=null;});
      save();render();toast('Fahrzeug gelöscht, Karten und Vorgänge sind wieder ohne Fahrzeug');break;}
    case 'add-card':{
      const r=normRfid(($('#newRfid')||{}).value);
      if(!r){toast('Gib die RFID der Karte ein');return;}
      setCard(r,{name:(($('#newCardName')||{}).value||'').trim(),vehicleId:($('#newCardVeh')||{}).value||null});
      save();render();toast('Karte gespeichert');break;}
    case 'del-card':{
      const r=t.dataset.id,n=S.sessions.filter(x=>x.rfid===r).length;
      if(!n){S.cards=S.cards.filter(c=>c.rfid!==r);save();render();toast('Karte gelöscht');}
      else{U.delCard=r;U.delWb=null;render();}
      break;}
    case 'card-move':{
      const r=t.dataset.id,to=($('#moveTo')||{}).value;
      if(!to){toast('Wähle eine Zielkarte');return;}
      S.sessions.forEach(x=>{if(x.rfid===r)x.rfid=to;});
      S.cards=S.cards.filter(c=>c.rfid!==r);
      U.delCard=null;save();render();toast('Vorgänge verschoben, Karte gelöscht');break;}
    case 'card-purge':{
      const r=t.dataset.id,n=S.sessions.filter(x=>x.rfid===r).length;
      S.sessions=S.sessions.filter(x=>x.rfid!==r);
      S.cards=S.cards.filter(c=>c.rfid!==r);
      U.delCard=null;save();render();toast('Karte und '+n+' '+(n===1?'Vorgang':'Vorgänge')+' gelöscht');break;}
    case 'add-wb':{
      const nm=(($('#newWbName')||{}).value||'').trim();
      let id=(($('#newWbId')||{}).value||'').trim();
      if(!nm){toast('Gib der Wallbox einen Namen');return;}
      if(!id)id='wb-'+(++S.seq);
      if(S.wallboxes.some(w=>w.id===id)){toast('Diese Wallbox-ID gibt es schon');return;}
      S.wallboxes.push({id:id,name:nm});save();render();toast('Wallbox angelegt');break;}
    case 'del-wb':{
      const id=t.dataset.id,n=S.sessions.filter(x=>x.wbId===id).length;
      if(!n){S.wallboxes=S.wallboxes.filter(w=>w.id!==id);save();render();toast('Wallbox gelöscht');}
      else{U.delWb=id;U.delCard=null;render();}
      break;}
    case 'wb-move':{
      const id=t.dataset.id,to=($('#moveTo')||{}).value;
      if(!to){toast('Wähle eine Zielwallbox');return;}
      S.sessions.forEach(x=>{if(x.wbId===id)x.wbId=to;});
      S.wallboxes=S.wallboxes.filter(w=>w.id!==id);
      U.delWb=null;save();render();toast('Vorgänge verschoben, Wallbox gelöscht');break;}
    case 'wb-purge':{
      const id=t.dataset.id,n=S.sessions.filter(x=>x.wbId===id).length;
      S.sessions=S.sessions.filter(x=>x.wbId!==id);
      S.wallboxes=S.wallboxes.filter(w=>w.id!==id);
      U.delWb=null;save();render();toast('Wallbox und '+n+' '+(n===1?'Vorgang':'Vorgänge')+' gelöscht');break;}
    case 'cancel-del':U.delCard=null;U.delWb=null;U.delSess=null;render();break;
    case 'entry-new':U.entry=entryNew();render();break;
    case 'entry-cancel':U.entry=null;render();break;
    case 'entry-save':saveEntry();break;
    case 'edit-sess':{const x=S.sessions.find(y=>y.id===t.dataset.id);if(x){U.entry=entryFrom(x);U.delSess=null;render();window.scrollTo(0,0);}break;}
    case 'del-sess':U.delSess=t.dataset.id;render();break;
    case 'sess-purge':{S.sessions=S.sessions.filter(x=>x.id!==t.dataset.id);U.delSess=null;save();render();toast('Vorgang gelöscht');break;}
    case 'rep-kind':repSetKind(t.dataset.v);render();break;
    case 'rep-print':try{window.print();}catch(x){toast('Drucken ist hier nicht möglich. Speichere das PDF.');}break;
    case 'rep-pdf':savePDF();break;
    case 'export-data':exportData();break;
    case 'restore-confirm':if(U.restorePending)applyRestore(U.restorePending);break;
    case 'restore-cancel':U.restorePending=null;render();break;
    case 'add-rule':{
      const from=(($('#newRuleFrom')||{}).value||'').trim(),wb=($('#newRuleWb')||{}).value||'all',pr=parseNum(($('#newRulePrice')||{}).value);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(from)){toast('Wähle ein Datum, ab dem der Preis gilt');return;}
      if(pr==null||pr<=0){toast('Gib einen Preis größer 0 ein');return;}
      S.tariff.rules.push({id:'r'+(++S.seq),from:from,wbId:wb,price:pr});
      save();render();toast('Preisregel angelegt, Kosten neu berechnet');break;}
    case 'del-rule':{
      S.tariff.rules=S.tariff.rules.filter(r=>r.id!==t.dataset.id);
      save();render();toast('Preisregel gelöscht');break;}
    case 'reset':
      if(!U.confirmReset){U.confirmReset=true;render();setTimeout(()=>{if(U.confirmReset){U.confirmReset=false;if(U.tab==='admin')render();}},4000);}
      else{S=demo();U.confirmReset=false;U.veh='all';U.card='all';U.wb='all';U.month='all';U.delCard=null;U.delWb=null;U.rep=null;U.entry=null;U.delSess=null;imp=newImp();save();render();toast('Sheet-Stand geladen');}
      break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ef!==undefined&&U.entry){U.entry[t.dataset.ef]=t.value;if(t.dataset.ef==='place')render();else updateEntrySum();return;}
  if(t.dataset.filter){U[t.dataset.filter]=t.value;if(t.dataset.filter==='veh')U.card='all';render();return;}
  if(t.dataset.map){imp.map[t.dataset.map]=+t.value;saveMap();renderImpResult();return;}
  if(t.dataset.rep!==undefined){U.rep[t.dataset.rep]=t.value;render();return;}
  if(t.dataset.tpl!==undefined){S.report[t.dataset.tpl]=t.value;save();refreshSheet();return;}
  if(t.dataset.block!==undefined){S.report.blocks[t.dataset.block]=t.checked;save();refreshSheet();return;}
  if(t.dataset.rule!==undefined){
    const r=S.tariff.rules.find(x=>x.id===t.dataset.rid);
    if(!r)return;
    if(t.dataset.rule==='from'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value))r.from=t.value;else{toast('Wähle ein gültiges Datum');render();return;}}
    else if(t.dataset.rule==='wb')r.wbId=t.value;
    else{const n=parseNum(t.value);if(n==null||n<=0){toast('Gib einen Preis größer 0 ein');render();return;}r.price=n;}
    save();render();toast('Preisregel gespeichert, Kosten neu berechnet');return;
  }
  if(t.dataset.wbName!==undefined){
    const w=S.wallboxes.find(x=>x.id===t.dataset.wbName),n=t.value.trim();
    if(w&&n){w.name=n;save();toast('Name gespeichert');}else render();
    return;
  }
  if(t.dataset.cardVeh!==undefined){setCard(t.dataset.cardVeh,{vehicleId:t.value||null});save();render();toast('Zuordnung gespeichert');return;}
  if(t.dataset.cardName!==undefined){setCard(t.dataset.cardName,{name:t.value.trim()});save();return;}
  if(t.dataset.vehName!==undefined){
    const v=S.vehicles.find(x=>x.id===t.dataset.vehName),n=t.value.trim();
    if(v&&n){v.name=n;save();toast('Name gespeichert');}else render();
    return;
  }
  if(t.id==='restoreFile'&&t.files&&t.files[0]){
    t.files[0].text().then(txt=>{
      let data;
      try{data=JSON.parse(txt);}catch(e){toast('Das ist keine gültige JSON-Datei');return;}
      if(!data||!Array.isArray(data.sessions)||!Array.isArray(data.vehicles)||!Array.isArray(data.cards)){toast('Keine gültige Sicherungsdatei (falsches Format)');return;}
      U.restorePending=data;render();
    }).catch(()=>{toast('Die Datei lässt sich nicht lesen');});
    return;
  }
  if(t.id==='impFile'&&t.files&&t.files[0]){
    t.files[0].arrayBuffer().then(buf=>{
      let txt;
      try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(x){txt=new TextDecoder('windows-1252').decode(buf);}
      imp.text=txt;const ta=$('#impText');if(ta)ta.value=txt;parseImport();
    }).catch(()=>{imp.err='Die Datei lässt sich nicht lesen. Füge den Inhalt stattdessen ins Feld ein.';renderImpResult();});
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='impText')imp.text=e.target.value;
  if(e.target.dataset&&e.target.dataset.ef!==undefined&&U.entry){U.entry[e.target.dataset.ef]=e.target.value;updateEntrySum();}
  if(e.target.dataset&&e.target.dataset.tpl!==undefined){S.report[e.target.dataset.tpl]=e.target.value;refreshSheet();}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='syPin'){e.preventDefault();const bt=document.querySelector('[data-act="sy-pin"]');if(bt)bt.click();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('label.btn')){e.preventDefault();const i=e.target.querySelector('input');if(i)i.click();}});

syInit();
render();
})();
</script>
</body>
</html>
